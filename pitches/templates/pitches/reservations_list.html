<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <!-- استدعاء خط Cairo من جوجل -->
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
    body {
        font-family: 'Cairo', Tahoma, sans-serif !important;
    }
</style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمة الحجوزات</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <h1 class="text-center text-primary fw-bold mb-4">⚽ قائمة جميع الحجوزات</h1>
        
        <div class="card shadow border-0 p-4">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>الملعب</th>
                            <th>اسم الحاجز</th>
                            <th>رقم الهاتف</th>
                            <th>التاريخ</th>
                            <th>الوقت</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for res in reservations %}
                        <tr>
                            <td class="fw-bold text-success">{{ res.pitch.name }}</td>
                            <td>{{ res.customer_name }}</td>
                            <td>{{ res.phone }}</td>
                            <td>{{ res.date }}</td>
                            <td><span class="badge bg-secondary">{{ res.time_slot }}</span></td>
                        </tr>
                        {% empty %}
                        <tr>
                            <td colspan="5" class="text-center text-muted py-4">لا توجد أي حجوزات مسجلة حتى الآن.</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
            
            <div class="text-center mt-3">
                <a href="{% url 'home' %}" class="btn btn-outline-primary">← العودة للرئيسية</a>
            </div>
        </div>
    </div>

</body>
</html>
