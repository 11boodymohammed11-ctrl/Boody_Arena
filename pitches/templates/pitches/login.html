<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <!-- استدعاء خط Cairo من جوجل -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', Tahoma, sans-serif !important;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <style>
        body {
            background-color: #f4f6f8;
            font-family: 'Cairo', Tahoma, sans-serif;
            direction: rtl;
            text-align: right;
            padding: 20px;
            margin: 0;
            box-sizing: border-box;
        }
        .card {
            background: white;
            width: 100%;
            max-width: 450px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.08);
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            color: #333;
            font-size: 1.5rem;
        }
        form p {
            margin-bottom: 15px;
        }
        form label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
            font-size: 14px;
        }
        form input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
        }
        .helptext, ul.errorlist {
            font-size: 11px;
            color: #666;
            list-style: none;
            padding: 0;
        }
        ul.errorlist {
            color: #d9534f;
        }
        button {
            width: 100%;
            background: #007bff;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>تسجيل الدخول ⚽</h2>
        <form method="POST">
            {% csrf_token %}

            {% if form.non_field_errors %}
                <ul class="errorlist">
                    <li>رقم الهاتف أو كلمة المرور غير صحيحة.</li>
                </ul>
            {% endif %}

            <p>
                <label for="id_username">رقم الهاتف</label>
                {{ form.username }}
            </p>
            <p>
                <label for="id_password">كلمة المرور</label>
                {{ form.password }}
            </p>

            <button type="submit">دخول</button>
        </form>
        
        <!-- رابط إنشاء حساب جديد -->
        <div class="text-center mt-3" style="text-align: center; margin-top: 15px;">
            <p style="font-size: 13px; color: #666;">
                ليس لديك حساب؟ 
                <a href="{% url 'register' %}" style="color: #007bff; font-weight: bold; text-decoration: none;">إنشاء حساب جديد</a>
            </p>
        </div>
    </div>

    <script>
        // تحويل الأرقام العربية (٠١٢٣) لأرقام إنجليزي تلقائياً
        document.addEventListener('DOMContentLoaded', function() {
            ['id_username', 'id_password'].forEach(function(id) {
                const el = document.getElementById(id);
                if (el) {
                    el.addEventListener('input', function() {
                        el.value = el.value.replace(/[٠-٩]/g, function(d) { return d.charCodeAt(0) - 1632; });
                    });
                }
            });
        });
    </script>
</body>
</html>
